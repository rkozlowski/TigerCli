name: Release TigerCli
run-name: Release TigerCli ${{ inputs.version }}

# The one release action (docs/contributing/releases.md). Started by hand on main
# for the version the release commit records: it builds that commit's release set
# once, inspects and smoke-tests it, records it, publishes those exact packages to
# GitHub Packages and nuget.org, tags the commit and creates the draft GitHub
# Release carrying the set. Every decision is an eng/release script a maintainer
# can run and test locally; this file only orders them and moves the set between
# jobs. The verification gate and release acceptance ran on dev before promotion
# and are not repeated here.
#
# The file name and the `release` environment are named by the nuget.org Trusted
# Publishing policy; keep both. The version reaches the scripts through
# RELEASE_VERSION, never through expression interpolation into a shell.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The <Major>.<Minor>.<Patch> version the release commit records in Version.props
        required: true
        default: "0.9.5"
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

concurrency:
  group: release-tigercli-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Only what the authoritative build needs to start safely.
  prerequisites:
    name: Version, notes, promotion, tag and packages free
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove the commit may be released as this version
        shell: pwsh
        run: |
          ./eng/release/Assert-ReleaseCommitReady.ps1 -Version $env:RELEASE_VERSION -CommitSha $env:GITHUB_SHA
          exit $LASTEXITCODE

  build:
    name: Build, inspect, smoke-test and record the release set
    needs: prerequisites
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      record_sha256: ${{ steps.build.outputs.record_sha256 }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build, check and record the release set
        id: build
        shell: pwsh
        run: |
          ./eng/release/Build-ReleaseArtifacts.ps1 -Version $env:RELEASE_VERSION -CommitSha $env:GITHUB_SHA -OutputDirectory artifacts/release -GitHubOutput $env:GITHUB_OUTPUT
          exit $LASTEXITCODE

      - name: The build changed no committed file
        run: git diff --exit-code

      - name: Hand the set to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: TigerCli-release-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the packages, tag the commit and create the draft release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Receive the set
        uses: actions/download-artifact@v7
        with:
          name: TigerCli-release-${{ inputs.version }}-${{ github.sha }}
          path: artifacts/release

      - name: Verify the NuGet.org Trusted Publishing configuration
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_USER)) {
              Write-Error "Set the NUGET_USER repository variable to the nuget.org profile username used by the Trusted Publishing policy."
              exit 1
          }

      - name: Get a short-lived NuGet.org API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the recorded packages
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RECORD_SHA256: ${{ needs.build.outputs.record_sha256 }}
        run: |
          ./eng/release/Publish-Packages.ps1 -Version $env:RELEASE_VERSION -ArtifactDirectory artifacts/release -CommitSha $env:GITHUB_SHA -ExpectedRecordSha256 $env:RECORD_SHA256
          exit $LASTEXITCODE

      - name: Tag the commit and create the draft release with the exact set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_SHA256: ${{ needs.build.outputs.record_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./eng/release/Publish-DraftRelease.ps1 -Version $env:RELEASE_VERSION -ArtifactDirectory artifacts/release -CommitSha $env:GITHUB_SHA -ExpectedRecordSha256 $env:RECORD_SHA256 -RunUrl $env:RUN_URL
          exit $LASTEXITCODE
